name: Feature Request
description:
  Suggest a new feature or enhancement for the Claude Code plugin or the Workday Everywhere SDK
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the sections below to help us understand your idea.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the project is this about?
      description: |
        The Claude Code plugin lives on the default branch. The `@workday/everywhere` SDK and CLI live on the [`sdk`](https://github.com/Workday/everywhere/tree/sdk) branch.
      options:
        - Claude Code plugin (Agent Gateway connector)
        - SDK or `everywhere` CLI
        - Documentation
        - "I'm not sure"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Provide a clear and concise description of the feature you'd like to see.
      placeholder: |
        Example: I would like the connector to expose a slash command that summarizes my open Workday tasks.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description:
        Explain the problem or need this feature would address. Help us understand why this is
        important to you.
      placeholder: |
        Example: I ask the same three questions every morning and have to phrase them from scratch each time.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: How would you use this feature?
      description: Walk us through a typical scenario where you'd use this feature.
      placeholder: |
        Example:
        1. Run `/workday:tasks` in any project
        2. Claude calls the gateway's task tools
        3. I get a short list of what needs my attention today
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: How do you imagine this working?
      description: |
        Describe how you think this feature should work. Don't worry about implementation details — just describe the developer experience you'd like to see.
      placeholder: |
        Example: A command shipped with the plugin that wraps the gateway's task tools behind one prompt.

  - type: textarea
    id: alternatives
    attributes:
      label: Have you tried any workarounds?
      description:
        Are there any current workarounds you're using? What other solutions have you considered?
      placeholder: |
        Example: I keep the prompt in a scratch file and paste it in, but it drifts out of date.

  - type: textarea
    id: examples
    attributes:
      label: Examples or References
      description: |
        Do any other plugins or connectors do something similar? Feel free to share links, screenshots, or examples.
      placeholder: |
        Example: Another MCP connector ships a `/standup` command that does roughly this shape of thing.

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      description: Help us understand the priority from your perspective.
      options:
        - 'Nice to have - would be convenient'
        - 'Important - would improve my workflow significantly'
        - 'Critical - I really need this to use the plugin effectively'
        - 'Unsure'
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Add any other context, ideas, or considerations about the feature request here.
      placeholder: Any additional information that might be helpful.
