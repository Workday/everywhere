name: Bug Report
description:
  Report a bug or unexpected behavior in the Claude Code plugin or the Workday Everywhere SDK
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the sections below to help us understand and fix the issue.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the project is this about?
      description: |
        The Claude Code plugin lives on the default branch. The `@workday/everywhere` SDK and CLI live on the [`sdk`](https://github.com/Workday/everywhere/tree/sdk) branch.
      options:
        - Claude Code plugin (Agent Gateway connector)
        - SDK or `everywhere` CLI
        - Documentation
        - "I'm not sure"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Provide a clear and concise description of what the bug is.
      placeholder: |
        Example: After `/plugin install everywhere@workday` and signing in via `/mcp`, Claude lists no Workday tools at all.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Tell us how to reproduce this issue. Be as specific as possible.
      placeholder: |
        1. Run `/plugin marketplace add Workday/everywhere`
        2. Run `/plugin install everywhere@workday`
        3. Run `/mcp` and sign in to `workday`
        4. Ask Claude a Workday question — see error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe what you expected to happen instead.
      placeholder: |
        Example: I expected Claude to list the gateway's tools and answer using my Workday data.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Describe what actually happened. Include any error messages you saw.
      placeholder: |
        Example: The build failed with the following error output ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description:
        If applicable, add screenshots or terminal output to help explain the problem. You can drag
        and drop images here.
      placeholder: Paste terminal output or drag and drop images here.

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Help us understand your setup.
      value: |
        - Operating System:
        - Claude Code version (plugin issues):
        - Plugin version (plugin issues):
        - Node.js version (SDK issues):
        - SDK version (SDK issues):

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Add any other context about the problem here. For example:
        - Does this happen every time or only sometimes?
        - Does it happen in a fresh project, or only in one particular workspace?
        - Are there any workarounds you've found?
      placeholder: Any additional information that might help us fix this bug.

  - type: dropdown
    id: occurrence
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Sometimes
        - Only happened once
        - I'm not sure
